name: Local checks

on:
  push:
    branches: [master, feat/web-screen-config]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified official release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified official release
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, verified official release
        with:
          node-version: '26'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Portable and backend tests, synthetic fixtures only
        run: python -m pytest -q
      - name: Browser script syntax
        run: node --check web/usage-config/app.js
      - name: Git whitespace
        run: git diff --check
